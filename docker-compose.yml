services:
  airflow-init:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    env_file: .env
    environment: &airflow-env
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/airflow-data/airflow.db
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "false"
      AIRFLOW__WEBSERVER__SECRET_KEY: local-development-only-change-me
      PYTHONPATH: /opt/airflow/project/src
    volumes: &airflow-volumes
      - ./airflow/dags:/opt/airflow/dags
      - ./src:/opt/airflow/project/src
      - ./sql:/opt/airflow/project/sql
      - ./scripts:/opt/airflow/project/scripts
      - ./docs:/opt/airflow/project/docs
      - ./airflow-data:/opt/airflow/airflow-data
    command: >
      bash -c "airflow db migrate && airflow users create
      --username $${AIRFLOW_ADMIN_USER:-admin}
      --password $${AIRFLOW_ADMIN_PASSWORD:-admin}
      --firstname Project --lastname Admin --role Admin
      --email admin@example.com || true"
    restart: "no"

  airflow-webserver:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    env_file: .env
    environment: *airflow-env
    volumes: *airflow-volumes
    ports:
      - "8080:8080"
    command: webserver
    restart: unless-stopped

  airflow-scheduler:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    env_file: .env
    environment: *airflow-env
    volumes: *airflow-volumes
    command: scheduler
    restart: unless-stopped
